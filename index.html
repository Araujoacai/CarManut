<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="description" content="CarManut — Acompanhamento inteligente de manutenção veicular. Histórico, lembretes e revisões baseados no manual do proprietário." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CarManut" />

  <title>CarManut — Manutenção Veicular</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash-screen" class="splash">
    <div class="splash-inner">
      <div class="splash-icon">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="64" height="64" rx="16" fill="#F59E0B"/>
          <path d="M12 40L16 28H48L52 40H12Z" fill="white" fill-opacity="0.2"/>
          <path d="M14 36H50L48 28H16L14 36Z" fill="white"/>
          <rect x="18" y="36" width="8" height="5" rx="2.5" fill="#0f0f0f"/>
          <rect x="38" y="36" width="8" height="5" rx="2.5" fill="#0f0f0f"/>
          <circle cx="22" cy="41" r="3.5" fill="#1a1a1a" stroke="white" stroke-width="1.5"/>
          <circle cx="42" cy="41" r="3.5" fill="#1a1a1a" stroke="white" stroke-width="1.5"/>
          <path d="M22 24H42" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <path d="M28 20V24" stroke="white" stroke-width="2" stroke-linecap="round"/>
          <path d="M36 20V24" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="splash-title">CarManut</h1>
      <p class="splash-sub">Manutenção Inteligente</p>
      <div class="splash-loader">
        <div class="splash-loader-bar"></div>
      </div>
    </div>
  </div>

  <!-- App Root -->
  <div id="app" class="app hidden">

    <!-- Top Header (dinâmico) -->
    <header id="app-header" class="app-header hidden">
      <div class="header-inner">
        <button id="btn-back" class="btn-icon hidden" aria-label="Voltar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 5l-7 7 7 7"/>
          </svg>
        </button>
        <div class="header-title-block">
          <h1 id="header-title" class="header-title">CarManut</h1>
          <span id="header-sub" class="header-sub hidden"></span>
        </div>
        <div class="header-actions">
          <button id="btn-user-avatar" class="btn-avatar hidden" aria-label="Conta">
            <img id="user-avatar-img" src="" alt="Avatar" />
          </button>
          <button id="btn-signout" class="btn-icon hidden" aria-label="Sair" title="Sair">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
              <polyline points="16 17 21 12 16 7"/>
              <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Page Container -->
    <main id="page-container" class="page-container"></main>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav" class="bottom-nav hidden">
      <button class="nav-item active" data-page="home" aria-label="Meus Veículos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span>Início</span>
      </button>
      <button class="nav-item" data-page="reminders" aria-label="Lembretes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 01-3.46 0"/>
        </svg>
        <span>Lembretes</span>
        <span id="reminder-badge" class="nav-badge hidden">0</span>
      </button>
      <button class="nav-item" data-page="add-service" aria-label="Registrar" id="nav-btn-add">
        <div class="nav-add-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </div>
        <span>Registrar</span>
      </button>
      <button class="nav-item" data-page="history" aria-label="Histórico">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <polyline points="12 8 12 12 14 14"/>
          <path d="M3.05 11a9 9 0 111.14 4.78M3 16v-5h5"/>
        </svg>
        <span>Histórico</span>
      </button>
      <button class="nav-item" data-page="settings" aria-label="Configurações">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
        <span>Config</span>
      </button>
    </nav>
  </div>

  <!-- Toast notifications -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Firebase SDK -->
  <script type="module" src="src/app.js"></script>
</body>
</html>
